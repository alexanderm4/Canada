
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Indigenous Population Data Visualization</title>

    <style>
        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        h2 {
            text-align: center;
            margin-top: 35px;
        }

        .visualization {
            background-color: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        iframe {
            width: 100%;
            height: 850px;
            border: none;
        }

        @media (max-width: 768px) {
            iframe {
                height: 950px;
            }
        }
    </style>
</head>

<body>

    <h1>Indigenous Population Data Visualization</h1>

    <div class="visualization">
        <h2>Indigenous Population Map</h2>
        <iframe src="./map.html"
                title="Indigenous Population Map">
        </iframe>
    </div>

    <div class="visualization">
        <h2>Indigenous Population Scatter Plot</h2>
        <iframe src="./scatter.html"
                title="Indigenous Population Scatter Plot">
        </iframe>
    </div>

</body>

</html>
